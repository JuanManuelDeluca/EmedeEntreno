<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMEDE — Anotate a tu horario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="admin-icon" type="button" aria-label="Acceso del dueño">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5m0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5"/></svg>
  </button>

  <div class="wrap">
    <header>
      <img class="logo-img" src="static/logo.png" alt="EMEDE">
      <p class="logo">EMEDE</p>
      <p class="dia" id="dia"></p>
    </header>

    <div id="horarios"></div>
    <p class="vacio" id="vacio" style="display:none;">Hoy no hay clases. ¡Nos vemos el próximo día hábil!</p>

    <p class="footer-note">Los horarios se reinician todos los días.</p>

    <div class="contacto">
      <a href="https://wa.me/5491138014930" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0 0 12.04 2m0 1.67a8.2 8.2 0 0 1 5.83 2.42 8.19 8.19 0 0 1 2.41 5.82c0 4.55-3.7 8.24-8.25 8.24a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.4c0-4.55 3.7-8.22 8.25-8.22M8.53 7.4c-.17 0-.45.06-.68.32-.23.25-.9.87-.9 2.13 0 1.25.92 2.46 1.04 2.63.13.17 1.78 2.83 4.42 3.85 2.19.85 2.63.68 3.11.64.48-.04 1.55-.63 1.77-1.24.22-.6.22-1.12.15-1.23-.07-.11-.24-.17-.5-.3-.26-.13-1.55-.77-1.79-.85-.24-.09-.42-.13-.58.13-.17.26-.66.85-.81 1.02-.15.17-.3.19-.56.06-.26-.13-1.09-.4-2.07-1.28-.77-.68-1.28-1.53-1.44-1.79-.15-.26-.02-.4.11-.53.12-.12.26-.3.4-.45.13-.15.17-.26.26-.43.09-.17.04-.32-.02-.45-.06-.13-.58-1.44-.81-1.96-.21-.51-.43-.44-.58-.45z"/></svg>
      </a>
      <a href="https://www.instagram.com/emede.entrenamientos/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2c-2.72 0-3.06.01-4.13.06-1.06.05-1.79.22-2.43.47a4.9 4.9 0 0 0-1.77 1.15A4.9 4.9 0 0 0 2.53 5.44c-.25.64-.42 1.37-.47 2.43C2 8.94 2 9.28 2 12s.01 3.06.06 4.13c.05 1.06.22 1.79.47 2.43a4.9 4.9 0 0 0 1.15 1.77c.5.5 1.02.9 1.77 1.15.64.25 1.37.42 2.43.47C8.94 22 9.28 22 12 22s3.06-.01 4.13-.06c1.06-.05 1.79-.22 2.43-.47a4.9 4.9 0 0 0 1.77-1.15 4.9 4.9 0 0 0 1.15-1.77c.25-.64.42-1.37.47-2.43.05-1.07.06-1.41.06-4.13s-.01-3.06-.06-4.13c-.05-1.06-.22-1.79-.47-2.43a4.9 4.9 0 0 0-1.15-1.77A4.9 4.9 0 0 0 18.56 2.53c-.64-.25-1.37-.42-2.43-.47C15.06 2.01 14.72 2 12 2m0 1.8c2.67 0 2.99.01 4.04.06.98.04 1.5.21 1.86.35.47.18.8.4 1.15.75.35.35.57.68.75 1.15.14.36.31.88.35 1.86.05 1.05.06 1.37.06 4.04s-.01 2.99-.06 4.04c-.04.98-.21 1.5-.35 1.86-.18.47-.4.8-.75 1.15-.35.35-.68.57-1.15.75-.36.14-.88.31-1.86.35-1.05.05-1.37.06-4.04.06s-2.99-.01-4.04-.06c-.98-.04-1.5-.21-1.86-.35a3.1 3.1 0 0 1-1.15-.75 3.1 3.1 0 0 1-.75-1.15c-.14-.36-.31-.88-.35-1.86C3.81 14.99 3.8 14.67 3.8 12s.01-2.99.06-4.04c.04-.98.21-1.5.35-1.86.18-.47.4-.8.75-1.15.35-.35.68-.57 1.15-.75.36-.14.88-.31 1.86-.35C8.01 3.81 8.33 3.8 12 3.8m0 3.06a5.14 5.14 0 1 0 0 10.28 5.14 5.14 0 0 0 0-10.28m0 8.48a3.34 3.34 0 1 1 0-6.68 3.34 3.34 0 0 1 0 6.68m6.54-8.68a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0"/></svg>
      </a>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <p id="modal-mensaje"></p>
      <div class="modal-botones">
        <button id="modal-cancelar" type="button" class="modal-cancelar">Cancelar</button>
        <button id="modal-aceptar" type="button" class="modal-aceptar">Aceptar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="admin-overlay">
    <div class="modal-card admin-card">
      <button id="admin-cerrar" type="button" class="admin-cerrar-x" aria-label="Cerrar">✕</button>

      <div id="admin-login">
        <p class="admin-titulo">Acceso del dueño</p>
        <input type="email" id="admin-email" placeholder="Email" autocomplete="username">
        <input type="password" id="admin-password" placeholder="Contraseña" autocomplete="current-password">
        <p id="admin-error" class="admin-error"></p>
        <button id="admin-entrar" type="button" class="admin-boton">Entrar</button>
        <button id="admin-olvide" type="button" class="admin-link">¿Olvidaste tu contraseña?</button>
      </div>

      <div id="admin-recuperar" style="display:none;">
        <p class="admin-titulo">Recuperar contraseña</p>
        <input type="email" id="admin-recuperar-email" placeholder="Email" autocomplete="username">
        <p id="admin-recuperar-msg" class="admin-error"></p>
        <button id="admin-recuperar-enviar" type="button" class="admin-boton">Enviar mail para recuperar</button>
        <button id="admin-recuperar-volver" type="button" class="admin-link">Volver</button>
      </div>

      <div id="admin-panel" style="display:none;">
        <p class="admin-titulo">Editar horarios y cupo</p>

        <label class="admin-label">Cupo máximo por horario</label>
        <input type="number" id="admin-cupo" min="1" max="50">

        <div id="admin-dias"></div>

        <p id="admin-guardado" class="admin-guardado"></p>
        <button id="admin-guardar" type="button" class="admin-boton">Guardar cambios</button>

        <button id="admin-mostrar-clave" type="button" class="admin-link">Cambiar contraseña</button>
        <div id="admin-cambiar-clave" style="display:none;">
          <input type="password" id="admin-clave-nueva" placeholder="Nueva contraseña" autocomplete="new-password">
          <input type="password" id="admin-clave-repetir" placeholder="Repetir contraseña" autocomplete="new-password">
          <p id="admin-clave-error" class="admin-error"></p>
          <button id="admin-clave-guardar" type="button" class="admin-boton admin-boton-secundario">Confirmar nueva contraseña</button>
        </div>

        <button id="admin-salir" type="button" class="admin-boton admin-boton-secundario">Cerrar sesión</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
